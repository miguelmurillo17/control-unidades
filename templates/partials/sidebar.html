{% load static %}
<div class="sidebar-overlay" onclick="closeSidebar()"></div>
<button class="hamburger" onclick="toggleSidebar()" aria-label="Menú">
    <span></span><span></span><span></span>
</button>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13" rx="2"/>
                <path d="M16 8h4l3 5v3h-7V8z"/>
                <circle cx="5.5" cy="18.5" r="2.5"/>
                <circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
        </span>
        <span>Control de Unidades</span>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav-app">
        <a href="{% url 'registrar_movimiento' %}" class="nav-item {% if active_nav == 'registrar' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Registrar movimiento
        </a>
        <a href="{% url 'mis_registros' %}" class="nav-item {% if active_nav == 'mis_registros' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            Mis registros
        </a>
        <a href="{% url 'mis_inspecciones' %}" class="nav-item {% if active_nav == 'mis_inspecciones' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            Mis inspecciones
        </a>
        <div class="nav-divider"></div>

        <div class="nav-group">
            <button
                class="nav-item nav-group-toggle"
                :class="{ active: planeacionActive }"
                @click="planeacionOpen = !planeacionOpen"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                Planeación
                <svg class="nav-chevron" :class="{ 'nav-chevron--open': planeacionOpen }"
                     xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <transition name="submenu">
                <div v-show="planeacionOpen" class="nav-submenu">
                    <a href="{% url 'manifiestos:list' %}" class="nav-item nav-subitem {% if active_nav == 'manifiestos' or active_nav == 'nuevo_manifiesto' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        Manifiestos
                    </a>
                </div>
            </transition>
        </div>

        <div class="nav-group">
            <button
                class="nav-item nav-group-toggle"
                :class="{ active: supervisionActive }"
                @click="supervisionOpen = !supervisionOpen"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                Supervisión
                <svg class="nav-chevron" :class="{ 'nav-chevron--open': supervisionOpen }"
                     xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <transition name="submenu">
                <div v-show="supervisionOpen" class="nav-submenu">
                    <a href="{% url 'dashboard' %}" class="nav-item nav-subitem {% if active_nav == 'resumen' or active_nav == 'estado' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="{% url 'todos_los_registros' %}" class="nav-item nav-subitem {% if active_nav == 'todos_los_registros' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        Registros
                    </a>
                    <a href="{% url 'dashboard_inspecciones' %}" class="nav-item nav-subitem {% if active_nav == 'dashboard_inspecciones' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        Inspecciones
                    </a>
                </div>
            </transition>
        </div>

        <div class="nav-group">
            <button
                class="nav-item nav-group-toggle"
                :class="{ active: catalogosActive }"
                @click="catalogosOpen = !catalogosOpen"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="4" height="6" rx="1"/>
                    <rect x="10" y="3" width="4" height="6" rx="1"/>
                    <rect x="18" y="3" width="4" height="6" rx="1"/>
                    <rect x="2" y="14" width="4" height="7" rx="1"/>
                    <rect x="10" y="14" width="4" height="7" rx="1"/>
                    <rect x="18" y="14" width="4" height="7" rx="1"/>
                </svg>
                Catálogos
                <svg class="nav-chevron" :class="{ 'nav-chevron--open': catalogosOpen }"
                     xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <transition name="submenu">
                <div v-show="catalogosOpen" class="nav-submenu">
                    <a href="{% url 'lineas:list' %}" class="nav-item nav-subitem {% if active_nav == 'lineas' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                            <line x1="4" y1="22" x2="4" y2="15"/>
                        </svg>
                        Líneas
                    </a>
                    <a href="{% url 'unidades:list' %}" class="nav-item nav-subitem {% if active_nav == 'unidades' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13" rx="2"/>
                            <path d="M16 8h4l3 5v3h-7V8z"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                        Unidades
                    </a>
                    <a href="{% url 'sucursales:list' %}" class="nav-item nav-subitem {% if active_nav == 'sucursales' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Sucursales
                    </a>
                    <a href="{% url 'usuarios:list' %}" class="nav-item nav-subitem {% if active_nav == 'usuarios' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Usuarios
                    </a>
                </div>
            </transition>
        </div>

        <div class="nav-group">
            <button
                class="nav-item nav-group-toggle"
                :class="{ active: adminActive }"
                @click="adminOpen = !adminOpen"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    <polyline points="16 11 18 13 22 9"/>
                </svg>
                Admin
                <svg class="nav-chevron" :class="{ 'nav-chevron--open': adminOpen }"
                     xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <transition name="submenu">
                <div v-show="adminOpen" class="nav-submenu">
                    <a href="{% url 'dashboard' %}" class="nav-item nav-subitem {% if active_nav == 'estado' or active_nav == 'resumen' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        Estado de unidades
                    </a>
                    <a href="#" class="nav-item nav-subitem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Usuarios
                    </a>
                </div>
            </transition>
        </div>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
            <span class="user-role">{{ user.get_rol_display }}</span>
        </div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-logout" title="Cerrar sesión">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </form>
    </div>
</aside>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;
const PLANEACION_KEYS  = ['manifiestos', 'nuevo_manifiesto'];
const SUPERVISION_KEYS = ['resumen', 'estado', 'mis_registros', 'todos_los_registros', 'dashboard_inspecciones'];
const CATALOGOS_KEYS   = ['lineas', 'unidades', 'sucursales', 'usuarios'];
const ADMIN_KEYS       = ['estado', 'resumen'];
createApp({
    data() {
        const activeNav = '{{ active_nav }}';
        return {
            planeacionOpen: PLANEACION_KEYS.includes(activeNav),
            planeacionActive: PLANEACION_KEYS.includes(activeNav),
            supervisionOpen: SUPERVISION_KEYS.includes(activeNav),
            supervisionActive: SUPERVISION_KEYS.includes(activeNav),
            catalogosOpen: CATALOGOS_KEYS.includes(activeNav),
            catalogosActive: CATALOGOS_KEYS.includes(activeNav),
            adminOpen: ADMIN_KEYS.includes(activeNav),
            adminActive: ADMIN_KEYS.includes(activeNav),
        };
    },
}).mount('#sidebar-nav-app');
</script>

<script>
function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
}
function closeSidebar() {
    document.body.classList.remove('sidebar-open');
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSidebar();
});
</script>
